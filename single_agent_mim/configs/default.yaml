seed: 42
output_dir: outputs

dataset:
  path: ../LoCoMo/data/locomo10.json
  split: data/splits/locomo_6_2_2.json

models:
  runtime:
    provider: openai_compatible
    model: ${RUNTIME_MODEL}
    api_key_env: RUNTIME_API_KEY
    base_url: ${RUNTIME_BASE_URL}
    temperature: 0.0
    max_tokens: 1200
    max_retries: 3
    supports_json_mode: true

  maintenance:
    provider: openai_compatible
    model: deepseek-v4-flash
    api_key: sk-795793db85c34154b0503b755186546b
    base_url: https://api.deepseek.com
    temperature: 0.0
    max_tokens: 12000
    timeout_seconds: 600
    max_retries: 3
    supports_json_mode: true
    reasoning_effort: high
    extra_body:
      thinking:
        type: enabled
    reject_reasoning_output: false

storage:
  backend: sqlite
  # Always resolved below outputs/<run_id>/ by MiMRuntime.
  path: state/memory.sqlite3
  busy_timeout_ms: 5000
  journal_mode: WAL
  foreign_keys: true

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  normalize: true
  batch_size: 32

construction:
  max_input_tokens: 12000
  window_messages: 40
  overlap_messages: 4
  max_steps_per_session: 8
  max_candidates_per_session: 30
  related_memory_limit: 10
  max_related_pool: 24
  max_search_more_calls: 0
  skill_candidate_k: 10
  skill_top_k: 2
  skill_disclose_k: 5
  skill_min_score: 0.20
  exact_duplicate_threshold: 1.0
  semantic_duplicate_candidate_threshold: 0.88

retrieval:
  semantic_candidate_k: 30
  bm25_candidate_k: 30
  keyword_candidate_k: 30
  structured_candidate_k: 30
  result_top_k: 8
  max_result_top_k: 24
  max_query_expansions: 4
  max_depth: 3
  rrf_k: 60
  semantic_weight: 0.40
  bm25_weight: 0.30
  keyword_weight: 0.15
  structured_weight: 0.15
  entity_match_multiplier: 1.10
  time_valid_multiplier: 1.20
  current_active_multiplier: 1.05
  temporal_mismatch_multiplier: 0.50
  bm25_k1: 1.5
  bm25_b: 0.75

access:
  max_steps: 6
  max_steps_per_question: 6
  max_search_calls: 4
  max_inspect_calls: 2
  memory_top_k: 5
  skill_candidate_k: 10
  skill_top_k: 2
  skill_disclose_k: 5
  skill_min_score: 0.20
  result_top_k: 8
  max_source_messages: 8

training:
  max_skill_iterations: 3
  replay_buffer_size: 10
  require_forced_replay: true
  require_natural_replay: true
  skill_cluster_target_size: 8
  skill_crud_batch_size: 10
  skill_batch_bank_context: 25
  skill_min_candidate_support: 1

prompts:
  construction_extraction: prompts/construction_extraction.md
  construction_decision: prompts/construction_decision.md
  access: prompts/access.md
  diagnosis_answer: prompts/diagnosis/answer_failure.md
  diagnosis_access: prompts/diagnosis/access_failure.md
  diagnosis_cons_screening: prompts/diagnosis/cons_failure_stage_a.md
  diagnosis_cons_trace: prompts/diagnosis/cons_failure_stage_b.md
  failure_access_diagnosis: prompts/failure/access_diagnosis.md
  failure_construction_diagnosis: prompts/failure/construction_diagnosis.md
  failure_blind_reanswer: prompts/failure/blind_reanswer.md
  skill_candidate_generation_access: prompts/skill_maker/candidate_generation_access.md
  skill_candidate_generation_construction: prompts/skill_maker/candidate_generation_construction.md
  skill_batch_crud_access: prompts/skill_maker/batch_crud_access.md
  skill_batch_crud_construction: prompts/skill_maker/batch_crud_construction.md
  skill_cluster_summarizer_access: prompts/skill_maker/cluster_summarizer_access.md
  skill_cluster_summarizer_construction: prompts/skill_maker/cluster_summarizer_construction.md
